<div class="shell">
<header class="topbar">
  <div class="topline"><div><div class="eyebrow">EMR ANNOTATION REVIEW · V2</div><h1>双人标注 · 差异裁决</h1><p class="subtitle" id="intro"></p></div><div><div class="top-actions"><button id="import-button">导入裁决记录</button><button id="download" class="primary">导出裁决记录</button><input type="file" id="import" accept=".json" hidden></div><div id="save" class="save-note" aria-live="polite">本地保存草稿 · 正式记录请导出</div></div></div>

<p class="overview-banner" id="filter-note" aria-live="polite"></p>

</section>
<section id="labels-view" class="wide-view panel view-hidden"><div class="panel-head"><h2>49个标签 · 差异与覆盖</h2><small>未出现标签不计为一致</small></div><div class="wide-inner"><div class="chart-head"><h3>差异最多的标签</h3><div class="legend"><span>精确共同</span><span class="a">仅A</span><span class="b">仅B</span></div></div><div id="label-chart"></div><div class="table-wrap" id="label-table"></div><div id="label-rule" class="label-rule view-hidden"></div></div></section>

</div>

<script>
'use strict';

const taskMap=new Map(p.tasks.map(t=>[t.key,t])),rowMap=new Map(p.review_rows.map(r=>[r.id,r]));

function renderRelations(t){const rows=visibleRows(t).filter(r=>r.kind==='关系');return `<div class="section-heading"><div><h3>实际方向与端点对照</h3><p>虚线：类型未记录 · 边上数字对应该侧关系顺序 · 点击边进入裁决</p></div></div><div class="notice">按当前实体标签布置节点，箭头表示导出实际方向。多标签节点单独提示；不自动补关系类型、不把可疑连接画成正确连接。</div><div class="relations-pair">${['A','B'].map(side=>`<section class="graph-panel"><h3>${side} · 人员 ${t.annotations[side].annotator} · ${t.annotations[side].relations.length} 条关系</h3>${graph(t,side)}</section>`).join('')}</div><h3 style="margin:18px 0 8px">关系逐条核查</h3><div class="table-wrap"><table class="pair-table"><thead><tr><th>A连接</th><th>B连接</th><th>核查状态</th></tr></thead><tbody>${rows.map(r=>`<tr class="selectable ${state.row===r.id?'selected':''}" data-row="${esc(r.id)}"><td>${arr(r.A).map(x=>relDescription(t,x)).join('<hr>')||'<span class="no-value">无对应连接</span>'}</td><td>${arr(r.B).map(x=>relDescription(t,x)).join('<hr>')||'<span class="no-value">无对应连接</span>'}</td><td>${statusChip(r.status)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">当前筛选无关系项</td></tr>'}</tbody></table></div>`}

for(const project of Object.keys(p.summary.projects))$('project').add(new Option('项目 '+project,project));for(const l of p.labels)$('label-filter').add(new Option(l.label,l.label));$('intro').textContent=`${p.summary.tasks}例病例 · ${p.summary.annotations}份双标 · ${p.summary.result_rows}条原始结果 · ${p.summary.review_rows}项核查`;
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-group],[data-row],[data-label]');if(!el)return;if(el.dataset.task){selectTask(el.dataset.task);return}if(el.dataset.nav){setNav(el.dataset.nav);return}if(el.dataset.tab){state.tab=el.dataset.tab;renderCase();return}if(el.dataset.adopt){adopt(el.dataset.adopt);return}if(el.dataset.row){selectRow(el.dataset.row);return}if(el.dataset.group!==undefined){selectGroup(Number(el.dataset.group));return}if(el.dataset.label){selectLabel(el.dataset.label);return}if(el.dataset.kind!==undefined){state.kind=el.dataset.kind;renderAll();return}if(el.dataset.chartKind){state.kind=el.dataset.chartKind;state.tab=el.dataset.chartKind==='关系'?'relations':el.dataset.chartKind==='属性'?'attributes':el.dataset.chartKind==='结构问题'||el.dataset.chartKind==='病例复核建议'?'notes':el.dataset.chartKind==='病例结论'?'checklist':'entities';setNav('cases');renderAll();return}if(el.dataset.matrixA){state.matrix=[el.dataset.matrixA,el.dataset.matrixB];state.kind='';setNav('cases');renderAll();return}if(el.id==='edit-case'){selectRow(currentTask().review_rows.find(r=>r.kind==='病例结论').id);return}if(el.id==='goto-label-cases'){setNav('cases');state.tab='entities';renderAll();return}});
document.addEventListener('change',e=>{if(e.target.id==='related-row'){selectRow(e.target.value);return}if(e.target.id==='window-select'){state.window=Number(e.target.value);const w=currentTask().display_windows[state.window];const index=groups(currentTask()).findIndex(g=>g.start>=w.start&&g.end<=w.end);if(index>=0)state.group=index;renderCase();return}if(e.target.id==='final-case'){const r=rowMap.get(state.row);decisions[r.id]={...decisions[r.id],final_answer:e.target.value};save();renderEditor();return}if(e.target.dataset.field){const r=rowMap.get(state.row);if(!r)return;decisions[r.id]??={status:'待裁决'};decisions[r.id][e.target.dataset.field]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();if(e.target.dataset.field==='status'){$('editor-status').textContent=e.target.value;renderMetrics();renderCaseList()}}});
for(const id of ['project','label-filter','scope','search'])$(id).addEventListener('input',()=>{state.inventoryPage=0;if(id==='project')state.matrix=null;renderAll()});$('clear-filters').onclick=()=>{$('project').value='';$('label-filter').value='';$('search').value='';$('scope').value='pending';state.kind='';state.matrix=null;renderAll()};
$('inventory-prev').onclick=()=>{state.inventoryPage--;renderInventory()};$('inventory-next').onclick=()=>{state.inventoryPage++;renderInventory()};$('import-button').onclick=()=>$('import').click();
function exportRecords(){const records=p.review_rows.map(r=>({id:r.id,task:r.task,kind:r.kind,status:'待裁决',final_answer:'',evidence_offsets:'',rule_ref:'',reason_category:'',reason:'',adjudicator:'',reviewed_at:'',needs_back_annotation:false,...decisions[r.id]}));const invalid=records.filter(d=>d.status==='已裁决'&&['final_answer','rule_ref','reason','adjudicator','reviewed_at'].some(f=>!String(d[f]??'').trim()));if(invalid.length){showAlert(`${invalid.length}项“已裁决”缺少最终答案、规则、理由、裁决人或时间，请补全再导出。`);selectRow(invalid[0].id);return}const blob=new Blob([JSON.stringify({version:p.version,sources:p.sources,review_context:p.review_context,exported_at:new Date().toISOString(),decisions:records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='adjudication-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save').textContent='已导出 '+records.length+' 项核查记录';clearAlert()}
$('download').onclick=exportRecords;
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const d=JSON.parse(await file.text());if(JSON.stringify(d.sources)!==JSON.stringify(p.sources)||JSON.stringify(d.review_context)!==JSON.stringify(p.review_context))throw Error('来源、配置或规则哈希不一致');if(!Array.isArray(d.decisions)||d.decisions.some(v=>!rowMap.has(v.id))||new Set(d.decisions.map(v=>v.id)).size!==d.decisions.length)throw Error('核查项ID不属于本批或存在重复');if(!confirm('导入将替换当前浏览器草稿。请先导出已有草稿。'))return;decisions=Object.fromEntries(d.decisions.map(v=>[v.id,v]));save();renderAll();$('save').textContent='已导入 '+d.decisions.length+' 项记录'}catch(err){showAlert('导入失败：'+err.message)}finally{e.target.value=''}};
renderAll();
</script>
</body>
</html>
