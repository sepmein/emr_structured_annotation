<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全量双人标注裁决工具</title>
<style>
:root{--ink:#172e3d;--muted:#607583;--line:#d8e3e9;--teal:#137665;--red:#a32f35;--bg:#f1f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit;border:1px solid #b6c8d2;border-radius:6px;padding:6px 9px;max-width:100%}button{cursor:pointer;background:white;color:var(--ink)}button:hover{border-color:var(--teal);color:var(--teal)}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:var(--red)}input,select,textarea{background:white}button:disabled{opacity:.5;cursor:wait}header{padding:17px 24px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:23px;margin:4px 0 12px}h3{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1720px;margin:auto;min-height:calc(100vh - 100px)}aside{background:#f8fafb;border-right:1px solid var(--line);padding:17px;height:calc(100vh - 100px);position:sticky;top:0;overflow:auto}aside input,aside select{width:100%;margin-bottom:8px}.case-list{display:grid;gap:7px;margin-top:13px}.case-button{text-align:left;padding:10px;background:white;border:1px solid var(--line);border-radius:7px;overflow-wrap:anywhere}.case-button.active{border:2px solid var(--teal)}.case-button span{display:block}.case-button .title{font-size:13px;font-weight:bold}.case-button .preview{font-size:12px;color:var(--muted)}.case-button .state{font-size:12px;color:var(--teal)}main{padding:22px;min-width:0}.panel,.group{background:white;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:18px}.alert{border-left:4px solid var(--red);background:#fff0ef;padding:13px 16px;border-radius:7px;margin:10px 0}.notice{background:#edf6f3;padding:11px;border-radius:6px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.group{scroll-margin-top:15px}.group.pending{border-left:4px solid #bd8a2e}.group .top{display:flex;justify-content:space-between;gap:8px;align-items:start}.tag{background:#e8f1f5;border-radius:25px;padding:2px 8px;font-size:12px;margin:2px;display:inline-block}.tag.pending{background:#fff0cf;color:#865a13}.tag.done{background:#e2f3eb;color:#176548}.quote{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f7fa;border-left:3px solid #9cb1be;padding:12px 16px;margin:12px 0}.columns{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px}.annotation,.candidate{padding:13px;border:1px solid var(--line);border-radius:7px;min-width:0}.candidate{background:#f1f9f5}.entity{padding:9px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}.entity:first-of-type{border-top:0}.entity b{font-size:14px}.attribute{font-size:12px;color:var(--muted)}.entity-editor{border-top:1px solid #cbe2d7;margin-top:8px;padding-top:10px}.entity-editor input[type=number]{width:75px}.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.attr-grid label{font-size:12px;color:var(--muted)}.attr-grid select{width:100%;font-size:13px}.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}textarea{width:100%;min-height:70px;resize:vertical}.review-box{background:#f7f9fa;padding:11px;margin-top:13px;border-radius:7px}.review-box input{min-width:200px;flex:1}.point{padding:9px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 115px;gap:12px}.point p{margin:3px 0}.point .trace{font-size:11px;overflow-wrap:anywhere;color:var(--muted)}details{margin:10px 0}summary{cursor:pointer;color:var(--teal)}.fulltext{white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;background:white;padding:18px;border:1px solid var(--line);font:15px/1.9 'Microsoft YaHei',sans-serif}.fulltext mark{background:#d7ece3;cursor:pointer;border-bottom:1px solid #59a189}.fulltext mark:hover{background:#b8deca}.selection{margin:10px 0;background:#eaf3f8;padding:10px;border-radius:7px}.approval{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.approval label{display:block;margin:7px 0}#toast{position:fixed;bottom:22px;right:22px;z-index:30;background:#193c49;color:white;max-width:600px;padding:12px 18px;border-radius:8px;display:none;box-shadow:0 3px 14px #0002}.relations{display:grid;gap:10px}.relation{padding:10px;border:1px solid var(--line);border-radius:6px;background:#fafcfd;overflow-wrap:anywhere}.guide-links a{color:var(--teal);margin-right:12px}.progress{height:5px;background:#dce8e8;border-radius:10px;margin:10px 0}.progress div{height:100%;background:var(--teal);border-radius:10px}#saveState.error{color:var(--red)}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:1100px){.columns{grid-template-columns:1fr 1fr}.candidate{grid-column:1/-1}.layout{grid-template-columns:235px minmax(0,1fr)}}@media(max-width:700px){header{padding:13px}h1{font-size:20px}.layout{display:block}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}.case-list{max-height:220px;overflow:auto;grid-template-columns:1fr 1fr}main{padding:12px}.columns{grid-template-columns:1fr}.candidate{grid-column:auto}.panel,.group{padding:14px}.point{grid-template-columns:1fr}.attr-grid{grid-template-columns:1fr 1fr}#toast{left:12px;right:12px;bottom:12px}}
</style></head><body>
<header><div><h1>全量双人标注裁决工具</h1><div class="muted small" id="counts">正在读取批次…</div></div><div class="actions"><button id="backup">导出审查备份</button><button id="exportApproved" class="primary">导出已确认裁决</button><button id="importButton">导入备份</button><input type="file" id="importFile" accept="application/json,.json" hidden><span id="saveState" class="small">尚未编辑</span></div></header>
<div class="layout"><aside><input id="caseSearch" placeholder="搜索任务号 / 病例理由" aria-label="搜索病例"><select id="caseFilter" aria-label="筛选病例"><option value="all">全部病例</option><option value="attention">含未决点或已知问题</option><option value="unreviewed">未确认的病例</option><option value="approved">已确认裁决</option></select><select id="projectFilter" aria-label="项目筛选"><option value="all">全部项目</option></select><div class="small muted" id="overallProgress"></div><div class="progress"><div id="overallBar"></div></div><div class="case-list" id="caseList"></div></aside><main id="main"><div class="empty">正在载入…</div></main></div><div id="toast" role="status"></div>
<script>
'use strict';
let index,current,doc,revision=0,tid='',dirty=false,saveQueue=Promise.resolve(),saveTimer,editCounter=0,selectedRange=null,groupFilter='all',groupSearch='',renderedGroups=[],loadingToken=0,approvalInFlight=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy=x=>JSON.parse(JSON.stringify(x));const chars=t=>Array.from(t);const slice=(s,e)=>chars(current.sample.text).slice(s,e).join('');
const fieldName=f=>index.field_names[f]||f;const valueName=(f,v)=>index.schema.fields[f]?.values[v]||v;
const caseNames={unreviewed:'未审查',reviewing:'审查中',approved:'已确认'};
function toast(message,error=false){$('toast').textContent=message;$('toast').style.background=error?'#95333a':'#193c49';$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',6500)}
function cacheKey(id=tid){return 'emr_review_draft:'+index.bundle_id+':'+id}
function cacheDraft(){if(!tid||!doc)return;try{localStorage.setItem(cacheKey(),JSON.stringify({revision,document:doc}))}catch(e){toast('浏览器本地备份不可用，请留意服务器保存状态',true)}}
function rememberedReviewer(){try{let name=localStorage.getItem('emr_review_reviewer:'+index.bundle_id);if(name)return name}catch(e){}return Object.values(index.review_state||{}).filter(s=>s.reviewer?.trim()).sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''))[0]?.reviewer||''}
function rememberReviewer(name){try{localStorage.setItem('emr_review_reviewer:'+index.bundle_id,name)}catch(e){}}
function operationNote(status){return {accepted:'人工点击核查：认可现有裁决',modified:'人工点击核查：确认已修改裁决',deleted:'人工点击核查：确认删除',pending:'人工选择暂缓裁决'}[status]||''}
async function flushSave(){do{await save()}while(dirty)}
function downloadLocalDraft(){cacheDraft();let outbox={};try{for(let key of Object.keys(localStorage))if(key.startsWith('emr_review_draft:'+index.bundle_id+':'))outbox[key]=JSON.parse(localStorage.getItem(key))}catch(e){}let data={format:'emr_browser_draft_v1',bundle_id:index.bundle_id,task_id:tid,revision,document:doc,browser_unsaved_drafts:outbox},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='unsaved_review_'+tid+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出本页编辑备份，包含尚未保存到服务器的内容')}
function groupReviewStatus(g){let draft=doc.group_drafts?.[g.id];if(draft)return draft.status;let statuses=[...new Set(g.point_ids.map(id=>doc.point_reviews[id]?.status).filter(Boolean))];return statuses.length===1?statuses[0]:'accepted'}
function groupReviewNote(g){if(doc.group_drafts?.[g.id])return doc.group_drafts[g.id].note;let notes=[...new Set(g.point_ids.map(id=>doc.point_reviews[id]?.note).filter(Boolean))];return notes.length===1?notes[0]:''}
function currentGroupModified(g){if(g.id==='case')return doc.candidate.case_decision!==current.sample.case_decision||doc.candidate.case_reason!==current.sample.case_reason;if(g.id==='relations')return JSON.stringify(doc.candidate.relations)!==JSON.stringify(current.sample.relations);if(!Number.isInteger(g.start))return false;return JSON.stringify(candidates(g))!==JSON.stringify(current.sample.entities.filter(e=>e.start<g.end&&e.end>g.start))}
async function approveCase(checkAll=false){if(!doc.reviewer.trim()){toast('请先填写一次审查人，之后自动沿用',true);$('reviewer').focus();return}if(checkAll){for(let g of current.groups){if(doc.group_drafts?.[g.id]?.status==='pending')continue;for(let id of g.point_ids)if(!doc.point_reviews[id]){let draft=doc.group_drafts?.[g.id],status=draft?.status||(currentGroupModified(g)?'modified':'accepted');doc.point_reviews[id]={status,note:draft?.note?.trim()||operationNote(status)+'（一键核查）'}}}doc.new_entities_reviewed=true;doc.alerts_reviewed=true;changed();renderGroups()}await flushSave();let token=editCounter;try{let result=await api('/api/approve',{task_id:tid,revision});revision=result.revision;if(token===editCounter&&!dirty)doc.case_status='approved';index.review_state[tid]={...index.review_state[tid],revision,status:'approved'};if(dirty)cacheDraft();$('saveState').textContent=dirty?'仍有待保存修改':`已保存 · 版本 ${revision}`;updateProgress();renderList();toast('本例裁决已确认')}catch(e){toast('草稿已保存；全例尚未确认：'+e.message,true)}}
async function api(url,body){let r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
function markDirty(){dirty=true;editCounter++;if(doc.case_status==='approved')doc.case_status='reviewing';$('saveState').className='small';$('saveState').textContent='待保存';cacheDraft();clearTimeout(saveTimer);saveTimer=setTimeout(()=>save().catch(e=>toast(e.message,true)),900)}
async function save(){clearTimeout(saveTimer);saveQueue=saveQueue.catch(()=>{}).then(async()=>{if(!dirty||!tid)return;const savingTid=tid,token=editCounter,body=copy(doc);cacheDraft();$('saveState').textContent='正在保存…';try{const result=await api('/api/save',{task_id:savingTid,revision,document:body});if(tid===savingTid){revision=result.revision;if(editCounter===token){dirty=false;try{localStorage.removeItem(cacheKey())}catch(e){}}else cacheDraft();index.review_state[tid]={revision,status:body.case_status,reviewer:body.reviewer,updated_at:result.updated_at,reviewed_points:Object.values(body.point_reviews).filter(v=>v.status!=='pending').length};$('saveState').className='small';$('saveState').textContent=dirty?'仍有待保存修改':`已保存 · 版本 ${revision}`;renderList();updateProgress()}}catch(e){$('saveState').className='small error';$('saveState').textContent='保存未成功：'+e.message+'（编辑已留在本页及浏览器备份）';cacheDraft();throw e}});return saveQueue}
function renderList(){let q=$('caseSearch').value.trim().toLowerCase(),filter=$('caseFilter').value,project=$('projectFilter').value;const rows=index.cases.filter(c=>(project==='all'||String(c.project)===project)&&(!q||(c.task_id+' '+c.case_reason).toLowerCase().includes(q))&&(filter==='all'||filter==='attention'&&(c.pending||c.alerts)||filter==='approved'&&index.review_state[c.task_id]?.status==='approved'||filter==='unreviewed'&&index.review_state[c.task_id]?.status!=='approved'));$('caseList').innerHTML=rows.map(c=>`<button class="case-button ${c.task_id===tid?'active':''}" data-case="${esc(c.task_id)}"><span class="title">${esc(c.task_id)} · ${esc(c.case_decision)}</span><span class="preview">${c.entities}实体 / ${c.relations}关系 / ${c.points}点${c.pending?' · '+c.pending+'未决':''}${c.alerts?' · 已知问题':''}</span><span class="state">${esc(caseNames[index.review_state[c.task_id]?.status||'unreviewed'])}</span></button>`).join('')||'<div class="empty">没有符合条件的病例</div>';let n=index.cases.filter(c=>index.review_state[c.task_id]?.status==='approved').length;$('overallProgress').textContent=`已确认 ${n}/${index.cases.length} 例；列表显示 ${rows.length} 例`;$('overallBar').style.width=n/index.cases.length*100+'%'}
function reviewCounts(g){let n=g.point_ids.filter(p=>doc.point_reviews[p]&&doc.point_reviews[p].status!=='pending').length;return [n,g.point_ids.length]}
function groupState(g){let [n,total]=reviewCounts(g);return total&&n===total?'done':'pending'}
function groupHasPending(g){return g.point_ids.some(id=>point(id)?.decision==='待复核')}
function point(id){return current.points.find(p=>p.id===id)}
function sourceEntities(g,a){return a.entities.filter(e=>Number.isInteger(g.start)&&e.start<g.end&&e.end>g.start)}
function candidates(g){return doc.candidate.entities.filter(e=>Number.isInteger(g.start)&&e.start<g.end&&e.end>g.start)}
function attrs(a,arrays=false){return Object.entries(a||{}).map(([f,val])=>`${esc(fieldName(f))}：${esc((arrays?val:[val]).map(v=>valueName(f,v)).join('、'))}`).join('；')}
function sameSources(g){if(current.annotations.length!==2)return false;const normalized=a=>JSON.stringify(sourceEntities(g,a).map(e=>[e.start,e.end,e.label,Object.keys(e.attributes||{}).sort().map(f=>[f,e.attributes[f]])]).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b))));return normalized(current.annotations[0])===normalized(current.annotations[1])}
function sourceEntityHTML(e){return `<div class="entity"><b>“${esc(e.text)}” → ${esc(e.label)}</b><div class="attribute">${attrs(e.attributes,true)||'没有已填属性'}</div><span class="small muted">[${e.start}, ${e.end})</span></div>`}
function originalColumn(g,a){const ents=sourceEntities(g,a);const orphanPoints=g.point_ids.map(point).filter(p=>p.source_annotation_id===a.annotation_id&&p.kind==='choices'&&!a.entities.some(e=>e.id===p.original.region_id));return `<section class="annotation"><h3>${esc(a.display_name)}</h3><div class="small muted">annotation ${a.annotation_id}</div>${ents.map(sourceEntityHTML).join('')||'<p class="muted">该位置没有实体标注</p>'}${orphanPoints.map(p=>`<div class="entity">独立属性：${esc(fieldName(p.original.from_name))} → ${esc(p.original.choices.map(v=>valueName(p.original.from_name,v)).join('、'))}</div>`).join('')}<button data-action="copy-source" data-group="${g.id}" data-alias="${esc(a.alias)}">将本组裁决改为${esc(a.display_name)}</button></section>`}
function optionList(values,selected,blank=false){return (blank?'<option value="">未填写</option>':'')+values.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function entityEditor(e){return `<div class="entity-editor" data-entity="${esc(e.id)}"><div class="inline"><b>“${esc(e.text)}”</b><button data-action="delete-entity" data-id="${esc(e.id)}" class="danger">删除</button></div><div class="inline"><label>起点 <input type="number" min="0" max="${chars(current.sample.text).length}" value="${e.start}" data-id="${esc(e.id)}" data-entity-field="start"></label><label>终点 <input type="number" min="1" max="${chars(current.sample.text).length}" value="${e.end}" data-id="${esc(e.id)}" data-entity-field="end"></label><select data-id="${esc(e.id)}" data-entity-field="label" aria-label="实体标签">${optionList(index.schema.labels,e.label)}</select></div><div class="attr-grid">${Object.entries(index.schema.fields).filter(([f,r])=>r.per_region&&r.scope.includes(e.label)).map(([f,r])=>`<label>${esc(fieldName(f))}${r.required?' *':''}<select data-id="${esc(e.id)}" data-attr="${esc(f)}">${'<option value="">未填写</option>'+Object.entries(r.values).map(([v,name])=>`<option value="${esc(v)}" ${e.attributes?.[f]===v?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`).join('')}</div></div>`}
function pointDescription(p){let o=p.original;if(o){if(p.kind==='labels')return `原标注：“${esc(o.text)}” → <b>${esc(o.labels.join('、'))}</b>`;if(p.kind==='choices')return `原标注：${o.text?'“'+esc(o.text)+'”的':''}${esc(fieldName(o.from_name))} → <b>${esc(o.choices.map(v=>valueName(o.from_name,v)).join('、'))}</b>`;if(p.kind==='relation'){let a=current.annotations.find(a=>a.annotation_id===p.source_annotation_id);return `原关系：${formatOriginalRelation(a,o)}`}}let final=p.final;if(p.kind==='attribute_final')return `AI属性：${esc(final.entity_id)} 的 ${esc(fieldName(final.field))} → ${esc(valueName(final.field,final.value))}`;if(p.kind==='entity_added')return `AI新增实体：“${esc(final.text)}” → ${esc(final.label)}`;if(p.kind==='relation_final')return `AI新增关系：${formatRelation(final,current.sample.entities)}`;return esc(p.kind)}
function pointRows(g){return g.point_ids.map(id=>{const p=point(id),r=doc.point_reviews[id]||{},annotation=current.annotations.find(a=>a.annotation_id===p.source_annotation_id);return `<div class="point"><div><p>${annotation?'<span class="tag">'+esc(annotation.display_name)+'</span>':''}${pointDescription(p)} <span class="tag">${esc(p.decision)}</span></p><p class="small">现有裁决理由：${esc(p.reason)}</p><div class="trace">${esc(id)} · ${esc(p.rule_ref)}</div><input value="${esc(r.note||'')}" placeholder="补充意见（可选，核查操作自动记录）" data-point="${esc(id)}" data-review-field="note" aria-label="点级裁决理由"></div><select data-point="${esc(id)}" data-review-field="status" aria-label="点级审查状态"><option value="">未审查</option>${[['accepted','认可现有裁决'],['modified','已修改裁决'],['deleted','确认删除'],['pending','暂缓裁决']].map(([v,n])=>`<option value="${v}" ${r.status===v?'selected':''}>${n}</option>`).join('')}</select></div>`}).join('')||'<p class="muted">此组没有旧追溯点；新增实体需在全例确认前核查。</p>'}
function reviewBox(g){let [n,total]=reviewCounts(g),status=groupReviewStatus(g),note=groupReviewNote(g);return `<div class="review-box"><div class="inline"><span class="tag ${groupState(g)}" data-progress="${g.id}">已审查 ${n}/${total} 点</span><select id="group_status_${g.id}" data-group-draft="${g.id}" data-group-field="status">${[["accepted","认可现有裁决"],["modified","已修改裁决"],["deleted","确认删除"],["pending","暂缓裁决"]].map(([v,n])=>`<option value="${v}" ${v===status?"selected":""}>${n}</option>`).join("")}</select><input id="group_note_${g.id}" value="${esc(note)}" data-group-draft="${g.id}" data-group-field="note" placeholder="补充意见（可选，无需填写即可核查）"><button data-action="review-group" data-group="${g.id}" class="primary">核查本组全部点</button></div><details><summary>逐点审查与原裁决理由（${total}点）</summary>${pointRows(g)}</details></div>`}

$('main').addEventListener('input',e=>{let t=e.target;if(t.dataset.groupDraft){doc.group_drafts??={};let g=current.groups.find(g=>g.id===t.dataset.groupDraft);doc.group_drafts[g.id]={status:$('group_status_'+g.id).value,note:t.value};changed();return}if(t.id==='reviewer'){doc.reviewer=t.value;rememberReviewer(t.value);changed()}if(t.id==='caseNote'){doc.case_note=t.value;changed()}if(t.id==='caseReason'){doc.candidate.case_reason=t.value;invalidatePoints(current.groups.find(g=>g.id==='case').point_ids);changed()}if(t.id==='groupSearch'){groupSearch=t.value;clearTimeout(t.timer);t.timer=setTimeout(renderGroups,220)}if(t.dataset.reviewField==='note'){doc.point_reviews[t.dataset.point]??={status:'pending',note:''};doc.point_reviews[t.dataset.point].note=t.value;changed()}});
$('main').addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;try{if(action==='save'){await flushSave();toast('已保存')}else if(action==='download-local'){downloadLocalDraft()}else if(action==='reload'){if(dirty&&!confirm('本页尚有未保存修改，重新加载会舍弃它们。继续吗？'))return;clearTimeout(saveTimer);dirty=false;await saveQueue.catch(()=>{});await loadCase(tid)}else if(action==='history'){await flushSave();let versions=await api('/api/history?task_id='+encodeURIComponent(tid));if(!versions.length){toast('本例尚无保存版本');return}let panel=document.createElement('section');panel.className='panel';panel.id='historyPanel';panel.innerHTML='<h3>已保存的历史版本</h3><p class=small>恢复会另存新版本，原版本仍保留；恢复后需要重新确认全例。</p>'+versions.map((v,i)=>'<button data-version-index='+i+'>版本 '+v.revision+' · '+esc(v.created_at)+'</button>').join(' ');document.getElementById('historyPanel')?.remove();$('main').prepend(panel);panel.onclick=async ev=>{let bt=ev.target.closest('[data-version-index]');if(!bt)return;if(!confirm('恢复所选历史版本，并另存一个新版本？'))return;doc=copy(versions[Number(bt.dataset.versionIndex)].document);doc.case_status='reviewing';dirty=true;editCounter++;await flushSave();renderCase();toast('已恢复历史内容并另存新版本')};panel.scrollIntoView()}else if(action==='next-case'||action==='previous-case'){let i=index.cases.findIndex(c=>c.task_id===tid)+(action==='next-case'?1:-1);if(index.cases[i])await loadCase(index.cases[i].task_id)}else if(action==='review-group'){let g=current.groups.find(g=>g.id===b.dataset.group);if(reviewGroup(g,$('group_status_'+g.id).value,$('group_note_'+g.id).value))renderGroups()}else if(action==='copy-source'){let g=current.groups.find(g=>g.id===b.dataset.group),a=current.annotations.find(a=>a.alias===b.dataset.alias),originals=sourceEntities(g,a);let newEntities=originals.map(o=>({...newEntity(o.start,o.end,o.label),attributes:Object.fromEntries(Object.entries(o.attributes||{}).filter(([f,vs])=>vs.length===1&&index.schema.fields[f]?.scope.includes(o.label)&&Object.hasOwn(index.schema.fields[f].values,vs[0])).map(([f,vs])=>[f,vs[0]]))}));invalidatePoints(g.point_ids);mutateEntities(new Set(candidates(g).map(e=>e.id)),newEntities)}else if(action==='delete-entity'){let ent=doc.candidate.entities.find(v=>v.id===b.dataset.id);current.groups.filter(g=>g.entity_ids.includes(ent.id)||Number.isInteger(g.start)&&ent.start<g.end&&ent.end>g.start).forEach(g=>invalidatePoints(g.point_ids));mutateEntities(new Set([ent.id]))}else if(action==='add-at-group'){let g=current.groups.find(g=>g.id===b.dataset.group);invalidatePoints(g.point_ids);mutateEntities(new Set(),[newEntity(g.start,g.end)])}else if(action==='add-selection'){if(!selectedRange)return;mutateEntities(new Set(),[newEntity(selectedRange.start,selectedRange.end,$('selectionLabel').value)]);toast('已新增实体，请核查必填属性')}else if(action==='delete-relation'){doc.candidate.relations.splice(Number(b.dataset.index),1);invalidatePoints(current.groups.find(g=>g.id==='relations').point_ids);changed();renderGroups()}else if(action==='add-relation'){let from=$('relationFrom').value,to=$('relationTo').value,type=$('relationType').value;if(!topologyAllowed(from,to,type))throw Error('该关系类型不适用于所选实体端点');if(doc.candidate.relations.some(r=>r.from_id===from&&r.to_id===to&&r.type===type))throw Error('这条关系已存在');doc.candidate.relations.push({from_id:from,to_id:to,type,direction:'right',reason:'人工裁决工具新增',rule_ref:'human_review'});invalidatePoints(current.groups.find(g=>g.id==='relations').point_ids);changed();renderGroups()}else if(action==='jump-alert'){let ent=doc.candidate.entities.find(e=>e.id===b.dataset.entity)||current.sample.entities.find(e=>e.id===b.dataset.entity);let g=current.groups.find(g=>Number.isInteger(g.start)&&ent.start<g.end&&ent.end>g.start);groupFilter='all';groupSearch='';$('groupFilter').value='all';$('groupSearch').value='';renderGroups();document.getElementById('group_'+g.id)?.scrollIntoView();history.replaceState(null,'','#'+tid+'/'+g.id)}else if(action==='jump-text'){$('textDetails').open=true;renderText();let mark=$('fulltext').querySelector(`[data-start="${b.dataset.start}"]`);if(mark){mark.scrollIntoView({block:'center'});mark.style.background='#ffd897'}else $('fulltext').scrollIntoView()}else if(action==='approve'||action==='approve-all'){b.disabled=true;approvalInFlight=true;$('main').inert=true;try{await approveCase(action==='approve-all')}finally{b.disabled=false;approvalInFlight=false;$('main').inert=false}}else if(action==='bulk-accept'){const alertIds=new Set(current.alerts.flatMap(a=>a.source_point_ids||[])),alertEntities=new Set(current.alerts.map(a=>a.entity_id));let n=0;for(let g of current.groups){if(groupHasPending(g)||g.point_ids.some(id=>alertIds.has(id))||g.entity_ids.some(id=>alertEntities.has(id)))continue;for(let id of g.point_ids)if(!doc.point_reviews[id]){doc.point_reviews[id]={status:'accepted',note:'人工在病例页批量认可现有裁决'};n++}}changed();renderGroups();toast(`已核查 ${n} 点；未决、暂缓与已知问题保留，草稿自动保存`)}}catch(err){toast(err.message,true)}});
$('main').addEventListener('mouseup',e=>{const root=$('fulltext');if(!root?.contains(e.target))return;let sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return;let range=sel.getRangeAt(0);if(!root.contains(range.startContainer)||!root.contains(range.endContainer))return;let before=range.cloneRange();before.selectNodeContents(root);before.setEnd(range.startContainer,range.startOffset);let start=chars(before.toString()).length,end=start+chars(range.toString()).length;if(start>=end)return;selectedRange={start,end};$('selection').innerHTML=`已选“<b>${esc(slice(start,end))}</b>” [${start}, ${end}) <select id="selectionLabel">${optionList(index.schema.labels,index.schema.labels[0])}</select> <button data-action="add-selection" class="primary">新增裁决实体</button>`});
$('caseList').addEventListener('click',e=>{let b=e.target.closest('[data-case]');if(b)loadCase(b.dataset.case).catch(err=>toast(err.message,true))});for(let id of ['caseFilter','projectFilter'])$(id).onchange=renderList;$('caseSearch').oninput=renderList;
async function download(approved){await flushSave();const data=await api('/api/export?approved='+(approved?'1':'0'));if(!approved){data.browser_unsaved_drafts={};try{for(let key of Object.keys(localStorage))if(key.startsWith('emr_review_draft:'+index.bundle_id+':'))data.browser_unsaved_drafts[key]=JSON.parse(localStorage.getItem(key))}catch(e){}}if(approved&&!data.exported_cases){toast('还没有完成全例确认的病例；可先导出审查备份',true);return}let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=approved?'reviewed_reference.json':'review_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${data.exported_cases} 例${approved?'已确认裁决':'审查草稿备份'}`)}
$('backup').onclick=()=>download(false).catch(e=>toast(e.message,true));$('exportApproved').onclick=()=>download(true).catch(e=>toast(e.message,true));$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await flushSave();let result=await api('/api/import',JSON.parse(await f.text()));index.review_state=(await api('/api/index')).review_state;await loadCase(tid);toast(`已恢复 ${result.imported} 例，${result.unchanged} 例相同草稿保留`)}catch(err){toast(err.message,true)}e.target.value=''};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='尚有未保存裁决'}});
(async()=>{index=await api('/api/index');$('counts').textContent=`${index.counts.cases}例 / ${index.counts.original_results}条原始结果 / ${index.counts.points}追溯点 / ${index.counts.pending}原未决点 · 本地保存，无模型调用`;$('projectFilter').innerHTML='<option value="all">全部项目</option>'+[...new Set(index.cases.map(c=>c.project))].sort((a,b)=>a-b).map(p=>`<option value="${p}">项目 ${p}</option>`).join('');let hash=decodeURIComponent(location.hash.slice(1)).split('/'),query=new URLSearchParams(location.search).get('task'),id=index.cases.some(c=>c.task_id===query)?query:index.cases.some(c=>c.task_id===hash[0])?hash[0]:index.cases[0].task_id;await loadCase(id,hash[1])})().catch(e=>{$('main').textContent='加载失败：'+e.message;toast(e.message,true)});
</script></body></html>
