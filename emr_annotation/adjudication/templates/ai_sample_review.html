<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI样例逐点裁决工作台</title>
<style>body{margin:0;background:#f4f6fa;color:#172b47;font:15px/1.6 system-ui}header{padding:24px;background:#132a49;color:white}main{padding:24px;max-width:1400px;margin:auto}select,input,button{padding:8px;margin:4px;border:1px solid #bcc8d8;border-radius:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px;border:1px solid #d8e0ec}table{border-collapse:collapse;width:100%;background:white}td,th{padding:8px;border:1px solid #d8e0ec;vertical-align:top;text-align:left}td{word-break:break-all}h2{margin-top:28px}.summary{padding:12px;background:#fff0cf}details{margin:8px 0}mark{background:#ffeb9c}code{font-size:12px}</style>
<header><h1>AI 样例逐点裁决</h1><p>供本地流程测试。病例理由由 AI 复核；实体与属性由字面规则辅助并记录修订。尚无专家签署，待复核点保留。原文仅在本地工作台展示。</p></header>
<main><div class="summary" id="summary"></div><label>病例 <select id="case"></select></label><label>筛选处理 <select id="filter"><option>全部</option><option>待复核</option><option>修订</option><option>删除</option></select></label><button id="download">下载当前样例 JSON</button><div id="content"></div></main>
<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('payload').textContent),select=document.getElementById('case'),filter=document.getElementById('filter');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('summary').textContent=`${data.counts.cases}例 / ${data.counts.original_results}条原始结果 / ${data.counts.point_rows}个追溯点 / ${data.counts.pending_points}个未决点 / ${data.counts.ner_masked_cases}例实体损失屏蔽。专家签署：0。`;
data.samples.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${s.task_id} · ${s.case_decision}`;select.appendChild(o)});
function render(){const s=data.samples[Number(select.value)],p=data.points.filter(p=>p.task_id===s.task_id&&(filter.value==='全部'||p.decision.includes(filter.value)));
const rows=p.map(p=>`<tr><td>${esc(p.id)}<br>${esc(p.kind)}</td><td>${esc(p.decision)}</td><td><details><summary>原点</summary><pre>${esc(JSON.stringify(p.original,null,2))}</pre></details><details><summary>样例答案</summary><pre>${esc(JSON.stringify(p.final,null,2))}</pre></details></td><td>${esc(p.reason)}<br><code>${esc(p.rule_ref)}</code></td></tr>`).join('');
document.getElementById('content').innerHTML=`<h2>${esc(s.task_id)}：${esc(s.case_decision)}</h2><p>${esc(s.case_reason)}（指南 ${esc(s.case_rule)}）</p><p>实体训练参与：${s.ner_supervised?'是':'否，未决点屏蔽'}；关系仅已知正例，其他对未知。</p><details><summary>展开原始全文（${s.text.length}字）</summary><pre>${esc(s.text)}</pre></details><details><summary>全部样例实体与属性（${s.entities.length}项）</summary><pre>${esc(JSON.stringify(s.entities,null,2))}</pre></details><h2>原始点处理与新增点 ${p.length}</h2><table><thead><tr><th>点号</th><th>处理</th><th>前后答案</th><th>理由/规则</th></tr></thead><tbody>${rows}</tbody></table>`;}
select.onchange=filter.onchange=render;render();document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data.samples,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='ai_sample_reference.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
